<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0E1622" />
      <stop offset="60%" stop-color="#05080C" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Circular AMOLED -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#1F2A37" stroke-width="6" />

  <!-- Arco do Velocímetro -->
  <path d="M 106 330 A 160 160 0 1 1 406 330" fill="none" stroke="#1A2433" stroke-width="26" stroke-linecap="round" />
  <path d="M 106 330 A 160 160 0 1 1 350 160" fill="none" stroke="url(#neonGrad)" stroke-width="26" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Silhueta da Moto / Guidão -->
  <g transform="translate(136, 175) scale(1.0)" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Rodas -->
    <circle cx="45" cy="125" r="32" stroke="#00E676" stroke-width="14" fill="#05080C" />
    <circle cx="195" cy="125" r="32" stroke="#00E676" stroke-width="14" fill="#05080C" />
    <!-- Quadro e Guidão -->
    <path d="M 45 125 L 95 125 L 135 75 L 180 75" />
    <path d="M 135 75 L 195 125" />
    <path d="M 120 48 L 145 75 L 115 125" stroke="#00B0FF" />
    <circle cx="112" cy="38" r="8" fill="#00E676" stroke="none" />
  </g>

  <!-- Badge Digital em R$ -->
  <rect x="156" y="375" width="200" height="56" rx="28" fill="#070A0E" stroke="#00E676" stroke-width="3" filter="url(#neonGlow)" />
  <text x="256" y="413" fill="#00E676" font-family="'Orbitron', monospace, sans-serif" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="2">R$ / KM</text>
</svg>
